<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-UAS Multi-Target Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="bg-gray-950 text-green-400 font-mono p-4">

    <header class="flex justify-between items-center border-b border-green-800 pb-3 mb-4">
        <div>
            <h1 class="text-xl font-bold tracking-widest text-green-300">🛡️ MULTI-TARGET C-UAS RADAR</h1>
            <p class="text-xs text-gray-500">MONITOREO DE ENJAMBRE Y GEOFENCING EN TIEMPO REAL</p>
        </div>
        <div id="connection-status" class="px-3 py-1 bg-red-950 text-red-400 border border-red-700 rounded text-xs font-bold">
            DESCONECTADO
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
        <div class="lg:col-span-3 bg-gray-900 border border-gray-800 rounded-lg overflow-hidden relative">
            <div id="map"></div>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-lg p-4 flex flex-col justify-between">
            <div>
                <h2 class="text-sm font-bold text-gray-400 border-b border-gray-800 pb-2 mb-3">AMENAZAS DETECTADAS</h2>
                <div id="drone-list" class="space-y-3 text-xs">
                    <p class="text-gray-500">Buscando señales...</p>
                </div>
            </div>

            <div id="alert-box" class="mt-6 p-3 bg-gray-950 border border-gray-800 text-center rounded transition-all">
                <span class="text-gray-500 text-xs block">ESTADO DEL PERÍMETRO</span>
                <span id="threat-level" class="text-sm font-bold text-green-400">SECTOR SEGURO</span>
            </div>
        </div>
    </div>

    <!-- Scripts Modulares -->
    <script src="static/js/map.js"></script>
    <script src="static/js/websocket.js"></script>
</body>
</html>
